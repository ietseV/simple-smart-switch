name: Android-app bouwen

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bouwen
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: APK hernoemen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SimpleSmartSwitch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleSmartSwitch
          path: SimpleSmartSwitch.apk

      - name: Release maken
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Smart Switch app (versie ${{ github.run_number }})
          body: Download SimpleSmartSwitch.apk op je Android-telefoon en installeer hem.
          files: SimpleSmartSwitch.apk
          make_latest: true
