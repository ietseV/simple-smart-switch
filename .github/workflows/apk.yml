name: Android-app bouwen

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bouwen
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: APK's hernoemen
        run: |
          cp android/app/build/outputs/apk/smartswitch/debug/app-smartswitch-debug.apk SimpleSmartSwitch.apk
          cp android/app/build/outputs/apk/groep7/debug/app-groep7-debug.apk Groep7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: |
            SimpleSmartSwitch.apk
            Groep7.apk

      - name: Release maken
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Smart Switch app (versie ${{ github.run_number }})
          body: |
            Download de app op je Android-telefoon en installeer hem.
            - SimpleSmartSwitch.apk: verbindt met Bluno C4:BE:84:20:1B:1B
            - Groep7.apk: verbindt met Bluno 94:A9:A8:41:5B:6A
          files: |
            SimpleSmartSwitch.apk
            Groep7.apk
          make_latest: true
