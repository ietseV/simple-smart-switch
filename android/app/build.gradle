plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.simplesmartswitch'
    compileSdk 34

    defaultConfig {
        applicationId 'nl.simplesmartswitch'
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
