<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>Groep 7 Commandocentrum</title>
<style>
  :root { --bg: #02030a; --amber: #ffb547; --cyan: #5ff2ff; --red: #ff4d5e; --text: #e9f6ff; --muted: #7d8aa6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  canvas.bgc { position: fixed; inset: 0; width: 100%; height: 100%; }
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    transition: opacity .6s, transform .6s cubic-bezier(.7,0,.2,1);
  }
  .gone { opacity: 0; transform: scale(1.08); pointer-events: none; }
  .gone-small { opacity: 0; transform: scale(.92); pointer-events: none; }

  /* ---------- verbinden ---------- */
  #connectScreen { justify-content: center; text-align: center; gap: 6px; }
  .tag { color: var(--amber); letter-spacing: 4px; font-size: .8rem; }
  h1 {
    margin: 4px 0 0; font: 800 2.1rem/1.05 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 6px; text-transform: uppercase;
    background: linear-gradient(180deg, #fff 0%, #ffd27a 55%, #ff9a2a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,170,60,.45));
  }
  .term {
    width: min(360px, 100%); min-height: 5.6em; margin: 26px 0 22px; padding: 12px 14px; text-align: left;
    border: 1px solid rgba(95,242,255,.35); border-radius: 10px; background: rgba(5,20,30,.55);
    color: var(--cyan); font-size: .85rem; white-space: pre-wrap; box-shadow: 0 0 24px rgba(95,242,255,.12) inset;
  }
  .cursor::after { content: "▌"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bigbtn {
    border: 2px solid var(--amber); background: rgba(255,181,71,.1); color: var(--amber);
    font: 800 1.05rem system-ui, sans-serif; letter-spacing: 3px; text-transform: uppercase;
    padding: 18px 26px; border-radius: 14px; cursor: pointer; touch-action: manipulation;
    box-shadow: 0 0 22px rgba(255,181,71,.35), 0 0 22px rgba(255,181,71,.2) inset;
    animation: hum 2.4s ease-in-out infinite;
  }
  .bigbtn:active { transform: scale(.97); }
  .bigbtn:disabled { opacity: .45; animation: none; }
  @keyframes hum { 50% { box-shadow: 0 0 36px rgba(255,181,71,.6), 0 0 26px rgba(255,181,71,.3) inset; } }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: .85rem; text-decoration: underline; padding: 10px; cursor: pointer; }
  .warn { color: var(--red); max-width: 340px; }

  /* ---------- station ---------- */
  #battleScreen { justify-content: space-between; padding-left: 0; padding-right: 0; }
  .hud { position: relative; z-index: 2; width: 100%; padding: 0 16px; }
  .hudrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pill { border: 1px solid rgba(95,242,255,.35); background: rgba(5,20,30,.55); color: var(--cyan);
    border-radius: 999px; padding: 7px 12px; font-size: .8rem; letter-spacing: 1px; }
  .pill.btn { cursor: pointer; font: inherit; font-size: .8rem; }
  #hudText { margin-top: 12px; min-height: 4.4em; color: var(--cyan); font-size: .85rem; white-space: pre-wrap;
    text-shadow: 0 0 8px rgba(95,242,255,.5); }
  .bottom { position: relative; z-index: 2; width: 100%; text-align: center; padding: 0 16px; }
  #title { font: 800 1.25rem system-ui, sans-serif; letter-spacing: 3px; text-transform: uppercase; min-height: 1.5em;
    text-shadow: 0 0 16px rgba(255,170,60,.55); }
  #fire { margin-top: 12px; width: min(320px, 100%); }
  #fire.restore { border-color: var(--cyan); color: var(--cyan); background: rgba(95,242,255,.08);
    box-shadow: 0 0 22px rgba(95,242,255,.35), 0 0 22px rgba(95,242,255,.2) inset; animation: none; }
  .row { display: flex; justify-content: center; gap: 4px; margin-top: 6px; }
  #log { text-align: left; font-size: 11px; white-space: pre-wrap; max-height: 26vh; overflow: auto; margin: 6px auto 0;
    max-width: 520px; background: rgba(0,0,0,.6); border-radius: 10px; padding: 8px; color: var(--muted); }
</style>
</head>
<body>
<canvas id="space" class="bgc"></canvas>

<!-- Scherm 1: verbinden -->
<section id="connectScreen" class="screen">
  <div class="tag">◆ GROEP 7 ◆</div>
  <h1>Commando&shy;centrum</h1>
  <div id="term" class="term cursor"></div>
  <button id="connect" class="bigbtn">Hyperdrive activeren</button>
  <button id="connectAll" class="link">Signaal niet gevonden? Toon alle apparaten</button>
  <p id="support" class="warn" hidden></p>
</section>

<!-- Scherm 2: station en planeet -->
<section id="battleScreen" class="screen gone-small" aria-hidden="true">
  <div class="hud">
    <div class="hudrow">
      <span class="pill">● <span id="devName">BLUNO</span></span>
      <button id="disconnect" class="pill btn">Verbreken ✕</button>
    </div>
    <div id="hudText" class="cursor"></div>
  </div>
  <div class="bottom">
    <div id="title">Doel in zicht</div>
    <button id="fire" class="bigbtn">⦿ Vuren</button>
    <div class="row">
      <button id="test" class="link">Verbinding testen</button>
      <button id="details" class="link">Logboek</button>
    </div>
    <div id="log" hidden></div>
  </div>
</section>

<script>
// ===================== Bluetooth (Bluno) =====================
const SERVICE  = '0000dfb0-0000-1000-8000-00805f9b34fb';
const SERIAL   = '0000dfb1-0000-1000-8000-00805f9b34fb';
const COMMAND  = '0000dfb2-0000-1000-8000-00805f9b34fb';
const CMD_ON = 'U', CMD_OFF = 'D', CMD_TEST = 'V';
const NAMES  = ['Bluno', 'BLUNO', 'bluno', 'GROEP', 'Groep', 'groep'];
const CHUNK  = 17;
const LOCK_MS = 1200;

const $ = id => document.getElementById(id);
let device = null, serial = null, busy = false, userDisconnect = false;
const enc = new TextEncoder();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function log(m) { $('log').textContent = `${new Date().toLocaleTimeString('nl-NL')}  ${m}\n` + $('log').textContent; }

async function writeCommand(ch, text) {
  const d = enc.encode(text);
  for (let i = 0; i < d.length; i += CHUNK) {
    const part = d.slice(i, i + CHUNK);
    if (ch.writeValueWithResponse) await ch.writeValueWithResponse(part); else await ch.writeValue(part);
  }
}
async function writeSerial(text) {
  const d = enc.encode(text);
  if (serial.properties.writeWithoutResponse && serial.writeValueWithoutResponse) await serial.writeValueWithoutResponse(d);
  else await serial.writeValue(d);
}
async function openGatt() {
  try { return await device.gatt.connect(); }
  catch (e) {
    log('Verbinden mislukt (' + e.message + '), nog één keer…');
    try { device.gatt.disconnect(); } catch (_) {}
    await sleep(1000);
    return await device.gatt.connect();
  }
}

async function connect(showAll) {
  $('connect').disabled = true;
  warp = 1;
  type('term', ['> Hyperdrive opgestart', '> Scannen naar het signaal…']);
  try {
    device = await navigator.bluetooth.requestDevice(showAll
      ? { acceptAllDevices: true, optionalServices: [SERVICE] }
      : { filters: [...NAMES.map(n => ({ namePrefix: n })), { services: [SERVICE] }], optionalServices: [SERVICE] });
    log('Gekozen: ' + (device.name || '(geen naam)'));
    device.addEventListener('gattserverdisconnected', onDisconnected);
    type('term', ['> Signaal gevonden: ' + (device.name || 'onbekend'), '> Koppeling maken…']);
    const server = await openGatt();
    const service = await server.getPrimaryService(SERVICE);
    serial = await service.getCharacteristic(SERIAL);
    try {
      const cmd = await service.getCharacteristic(COMMAND);
      await writeCommand(cmd, 'AT+PASSWOR=DFRobot\r\n');
      await writeCommand(cmd, 'AT+CURRUART=115200\r\n');
    } catch (e) { log('AT-commando mislukt: ' + e.message); }
    serial.addEventListener('characteristicvaluechanged', e => {
      const t = new TextDecoder().decode(e.target.value);
      log('Ontvangen: ' + JSON.stringify(t));
      if (t.includes('OK')) hud(['> Testsignaal ontvangen.', '> Verbinding: sterk en stabiel.']);
    });
    try { await serial.startNotifications(); } catch (e) { log('Meldingen niet beschikbaar: ' + e.message); }
    userDisconnect = false;
    showBattle(device.name || 'BLUNO');
  } catch (e) {
    log('Fout: ' + e.name + ': ' + e.message);
    if (device?.gatt?.connected) device.gatt.disconnect();
    serial = null;
    type('term', e.name === 'NotFoundError'
      ? ['> Hyperdrive afgebroken.', '> Klaar voor een nieuwe sprong.']
      : ['> Sprong mislukt.', /service/i.test(e.message) ? '> Dit is niet ons schip (geen Bluno).' : '> Probeer het opnieuw.']);
  }
  warp = 0;
  $('connect').disabled = false;
}

function onDisconnected() {
  serial = null; log('Verbinding verbroken');
  showConnect(userDisconnect ? ['> Verbinding verbroken.', '> Tot de volgende missie.'] : ['> Signaal verloren!', '> Activeer de hyperdrive opnieuw.']);
}

async function send(cmd) {
  if (!serial || busy) return false;
  busy = true; updateFire();
  try { await writeSerial(cmd); log(`Verstuurd: ${cmd} (${cmd.charCodeAt(0)})`); }
  catch (e) { log('Versturen mislukt: ' + e.message); busy = false; updateFire(); hud(['> Commando mislukt.', '> Probeer het opnieuw.']); return false; }
  setTimeout(() => { busy = false; updateFire(); }, cmd === CMD_TEST ? 400 : LOCK_MS);
  return true;
}

// ===================== Teksten =====================
const typers = {};
function type(id, lines) {
  clearInterval(typers[id]);
  const el = $(id), full = lines.join('\n');
  let i = 0; el.textContent = '';
  typers[id] = setInterval(() => { el.textContent = full.slice(0, ++i); if (i >= full.length) clearInterval(typers[id]); }, 22);
}
const hud = lines => type('hudText', lines);

function showConnect(lines) {
  $('connectScreen').classList.remove('gone');
  $('battleScreen').classList.add('gone-small');
  $('battleScreen').setAttribute('aria-hidden', 'true');
  type('term', lines);
}
function showBattle(name) {
  $('devName').textContent = name.toUpperCase();
  $('connectScreen').classList.add('gone');
  $('battleScreen').classList.remove('gone-small');
  $('battleScreen').setAttribute('aria-hidden', 'false');
  hud(['> STATION OBSIDIAAN online.', '> Wapensysteem: gereed.', '> Doel vergrendeld: planeet Veridia.']);
  updateFire();
}
function updateFire() {
  const b = $('fire');
  b.disabled = busy || phase === 'charge' || phase === 'restore';
  b.classList.toggle('restore', phase === 'destroyed');
  b.textContent = phase === 'destroyed' ? '⟲ Tijdlijn herstellen' : '⦿ Vuren';
  $('title').textContent = { idle: 'Doel in zicht', charge: 'Hoofdkanon laadt op…', destroyed: 'Veridia is niet meer',
    restore: 'Tijd spoelt terug…' }[phase];
}

$('connect').onclick = () => connect(false);
$('connectAll').onclick = () => connect(true);
$('disconnect').onclick = () => { userDisconnect = true; if (device?.gatt?.connected) device.gatt.disconnect(); else showConnect(['> Verbinding verbroken.']); };
$('test').onclick = async () => { if (await send(CMD_TEST)) hud(['> Testsignaal verstuurd…']); };
$('details').onclick = () => { $('log').hidden = !$('log').hidden; };
$('fire').onclick = () => action();

if (!navigator.bluetooth) {
  $('connect').disabled = true; $('connectAll').hidden = true; $('support').hidden = false;
  $('support').textContent = !window.isSecureContext ? 'Open deze pagina via https, anders werkt Bluetooth niet.'
    : /iPhone|iPad|iPod/.test(navigator.userAgent) ? 'Op een iPhone werkt Bluetooth alleen in de gratis app Bluefy.'
    : 'Deze browser kan geen Bluetooth gebruiken. Gebruik Chrome op Android.';
}
type('term', ['> Commandocentrum gereed.', '> Wachten op de commandant…']);

// ===================== Ruimte, station en planeet =====================
const cv = $('space'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, DPR, warp = 0, warpV = 0;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();

const stars = Array.from({ length: 220 }, () => ({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() }));
let phase = 'idle', pt = 0, shake = 0, flash = 0, shock = -1;
const frags = [];

const ST = () => ({ x: W * 0.28, y: H * 0.33, r: Math.min(W, H) * 0.13 });   // station
const PL = () => ({ x: W * 0.70, y: H * 0.60, r: Math.min(W, H) * 0.17 });   // planeet

async function action() {
  if (busy) return;
  if (phase === 'idle') {
    if (!(await send(CMD_ON))) return;
    phase = 'charge'; pt = 0;
    hud(['> Energie naar de kern…', '> Hoofdkanon laadt op.', '> Vuur over 3… 2… 1…']);
    if (navigator.vibrate) navigator.vibrate([30, 60, 30, 60, 120]);
  } else if (phase === 'destroyed') {
    if (!(await send(CMD_OFF))) return;
    phase = 'restore'; pt = 0;
    frags.forEach(f => { f.sx = f.x; f.sy = f.y; f.sa = f.a; });
    hud(['> Tijdmachine geactiveerd.', '> Tijdlijn wordt hersteld…']);
  }
  updateFire();
}

function explode() {
  const p = PL();
  frags.length = 0;
  const cols = ['#2e7dd1', '#3fa34d', '#7fc8f8', '#d9c48a', '#1d5ea8', '#5bbf6a'];
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * p.r * 0.85;
    const hx = Math.cos(a) * d, hy = Math.sin(a) * d;
    const sp = p.r * (1.2 + Math.random() * 2.8);
    frags.push({ hx, hy, x: p.x + hx, y: p.y + hy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      a: Math.random() * 6, va: (Math.random() - .5) * 5, s: p.r * (0.05 + Math.random() * 0.12),
      c: cols[i % cols.length], n: 3 + (i % 3) });
  }
  shake = 1; flash = 1; shock = 0;
  if (navigator.vibrate) navigator.vibrate([200, 50, 100]);
  hud(['> Treffer!', '> Doel uitgeschakeld.', '> Druk op herstellen om de tijd terug te spoelen.']);
}

function drawStation(s, t, charge) {
  ctx.save(); ctx.translate(s.x, s.y);
  // romp: zeshoek
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * s.r, Math.sin(a) * s.r); }
  ctx.closePath();
  const g = ctx.createLinearGradient(-s.r, -s.r, s.r, s.r); g.addColorStop(0, '#5a6478'); g.addColorStop(1, '#1c2130');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(140,160,190,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  // panelen
  ctx.strokeStyle = 'rgba(20,24,36,.7)'; ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * s.r, Math.sin(a) * s.r); ctx.stroke(); }
  // draaiende ring
  ctx.rotate(t * 0.4);
  ctx.strokeStyle = 'rgba(95,242,255,.55)'; ctx.lineWidth = s.r * 0.06;
  for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.arc(0, 0, s.r * 0.66, i * Math.PI / 4, i * Math.PI / 4 + Math.PI / 6); ctx.stroke(); }
  ctx.rotate(-t * 0.4);
  // lichtjes
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6 + 0.2, on = Math.sin(t * 2 + i) > 0.3;
    ctx.fillStyle = on ? 'rgba(255,181,71,.95)' : 'rgba(255,181,71,.25)';
    ctx.beginPath(); ctx.arc(Math.cos(a) * s.r * 0.86, Math.sin(a) * s.r * 0.86, s.r * 0.025, 0, 7); ctx.fill();
  }
  // kern
  const k = 0.22 + charge * 0.18;
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, s.r * k * 2.2);
  cg.addColorStop(0, `rgba(255,255,255,${0.9})`); cg.addColorStop(0.35, `rgba(190,120,255,${0.6 + charge * 0.4})`); cg.addColorStop(1, 'rgba(120,60,255,0)');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, s.r * k * 2.2, 0, 7); ctx.fill();
  ctx.restore();
}

function drawPlanet(p, t) {
  // atmosfeer
  const ag = ctx.createRadialGradient(p.x, p.y, p.r * 0.9, p.x, p.y, p.r * 1.35);
  ag.addColorStop(0, 'rgba(110,190,255,.35)'); ag.addColorStop(1, 'rgba(110,190,255,0)');
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.35, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.clip();
  const og = ctx.createRadialGradient(p.x - p.r * .4, p.y - p.r * .4, p.r * .1, p.x, p.y, p.r);
  og.addColorStop(0, '#4fa3ef'); og.addColorStop(1, '#123a78'); ctx.fillStyle = og; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  // land (draait langzaam)
  const off = (t * 0.06) % 1;
  ctx.fillStyle = '#3e9b53';
  [[-.2, -.25, .35, .22], [.35, .15, .3, .18], [-.45, .35, .25, .14], [.1, -.55, .2, .1], [.6, -.35, .18, .12]].forEach(([dx, dy, rx, ry], i) => {
    const x = p.x + (((dx + off * 2 + 1) % 2) - 1) * p.r * 1.3;
    ctx.beginPath(); ctx.ellipse(x, p.y + dy * p.r, rx * p.r, ry * p.r, i, 0, 7); ctx.fill();
  });
  // wolken
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 4; i++) {
    const x = p.x + (((i * .55 + t * 0.1) % 2) - 1) * p.r * 1.3, y = p.y + (i - 1.5) * p.r * 0.42;
    ctx.beginPath(); ctx.ellipse(x, y, p.r * 0.32, p.r * 0.06, 0.1, 0, 7); ctx.fill();
  }
  // schaduw
  const sg = ctx.createRadialGradient(p.x - p.r * .5, p.y - p.r * .5, p.r * .3, p.x, p.y, p.r * 1.2);
  sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,10,.6)'); ctx.fillStyle = sg; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  ctx.restore();
}

function drawFrag(f) {
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
  ctx.fillStyle = f.c; ctx.beginPath();
  for (let i = 0; i < f.n; i++) { const a = i / f.n * Math.PI * 2; const r = f.s * (0.7 + (i % 2) * 0.4); ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,140,40,.6)'; ctx.fillRect(-f.s * .2, -f.s * .2, f.s * .4, f.s * .4);
  ctx.restore();
}

const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000 * (reduce ? 0.4 : 1);
  pt += dt;
  warpV += ((warp ? 1 : 0) - warpV) * Math.min(1, dt * 2);

  ctx.save();
  if (shake > 0 && !reduce) { ctx.translate((Math.random() - .5) * 18 * shake, (Math.random() - .5) * 18 * shake); shake = Math.max(0, shake - dt * 1.6); }
  ctx.fillStyle = '#02030a'; ctx.fillRect(-20, -20, W + 40, H + 40);

  // sterren (met hyperspace-strepen bij verbinden)
  const cx = W / 2, cy = H / 2, speed = 0.05 + warpV * 1.6;
  for (const s of stars) {
    s.z -= dt * speed * (reduce ? 0.3 : 1);
    if (s.z <= 0.02) { s.z = 1; s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; }
    const k = 0.5 / s.z, x = cx + s.x * W * k, y = cy + s.y * H * k;
    const k2 = 0.5 / Math.min(1, s.z + 0.04 + warpV * 0.25), x2 = cx + s.x * W * k2, y2 = cy + s.y * H * k2;
    const a = Math.min(1, (1 - s.z) * 1.4);
    ctx.strokeStyle = `rgba(220,235,255,${a})`; ctx.lineWidth = (1 - s.z) * 2 + 0.3;
    ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x + 0.01, y); ctx.stroke();
  }

  const battle = !$('battleScreen').classList.contains('gone-small');
  if (battle) {
    const s = ST(), p = PL();
    let charge = 0;
    if (phase === 'charge') {
      charge = Math.min(1, pt / 1.4);
      // energie stroomt naar de kern
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 + t * 3, d = s.r * (1.6 - ((t * 1.5 + i * .1) % 1) * 1.4);
        ctx.fillStyle = 'rgba(200,140,255,.85)'; ctx.beginPath(); ctx.arc(s.x + Math.cos(a) * d, s.y + Math.sin(a) * d, 2.2, 0, 7); ctx.fill();
      }
    }
    drawStation(s, t, charge);

    if (phase !== 'destroyed' && phase !== 'restore') drawPlanet(p, t);

    // straal
    if (phase === 'charge' && pt > 1.4) {
      const b = Math.min(1, (pt - 1.4) / 0.15);
      const ex = s.x + (p.x - s.x) * b, ey = s.y + (p.y - s.y) * b;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(170,110,255,.35)'; ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = 'rgba(210,170,255,.9)'; ctx.lineWidth = 8; ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
      if (pt > 1.9) { phase = 'destroyed'; pt = 0; explode(); updateFire(); }
    }

    // brokstukken
    if (phase === 'destroyed') {
      for (const f of frags) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.985; f.vy *= 0.985; f.a += f.va * dt; drawFrag(f); }
    } else if (phase === 'restore') {
      const k = ease(Math.min(1, pt / 1.8));
      for (const f of frags) { f.x = f.sx + (p.x + f.hx - f.sx) * k; f.y = f.sy + (p.y + f.hy - f.sy) * k; f.a = f.sa * (1 - k); drawFrag(f); }
      if (k > 0.85) { ctx.globalAlpha = (k - .85) / .15; drawPlanet(p, t); ctx.globalAlpha = 1; }
      if (pt >= 1.8) { phase = 'idle'; pt = 0; frags.length = 0; updateFire();
        hud(['> Tijdlijn hersteld.', '> Veridia leeft. De bewoners merken er niets van.', '> Wapensysteem: gereed.']); }
    }

    // schokgolf
    if (shock >= 0) {
      shock += dt * 0.9;
      ctx.strokeStyle = `rgba(255,220,170,${Math.max(0, .8 * (1 - shock))})`; ctx.lineWidth = 6 * (1 - shock) + 1;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * (1 + shock * 5), p.r * (0.25 + shock * 1.2), -0.25, 0, 7); ctx.stroke();
      if (shock >= 1) shock = -1;
    }
  }
  ctx.restore();

  // witte flits
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 1.8); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
